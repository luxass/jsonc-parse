name: GitHub Actions Security Analysis

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/**"
  push:
    branches:
      - main
      - "renovate/**"
    paths:
      - ".github/workflows/**"

permissions: {}

jobs:
  zizmor:
    uses: luxass/shared-workflows/.github/workflows/reusable-ci-security.yaml@411fe8f8a0a53eab5153356ac5e0f174cd245eb2 # v0.17.1
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    with:
      zizmor-version: v1.25.0
