name: Release

on:
  workflow_dispatch:
    inputs:
      expected-sha:
        description: Optional exact commit SHA for automated dispatches
        type: string
        required: false
      release-notes:
        description: Optional intro above the generated release notes
        type: string
        required: false

permissions: {}

concurrency:
  group: npm-staged-release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    uses: luxass/shared-workflows/.github/workflows/reusable-release-npm-staged.yaml@411fe8f8a0a53eab5153356ac5e0f174cd245eb2 # v0.17.1
    with:
      expected-sha: ${{ inputs.expected-sha }}
      release-notes: ${{ inputs.release-notes }}
