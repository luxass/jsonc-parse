ignoreScripts: true
minimumReleaseAge: 7200
trustPolicy: no-downgrade
catalogMode: prefer
strictDepBuilds: true
blockExoticSubdeps: true

minimumReleaseAgeExclude:
  - "@luxass/strip-json-comments"

catalogs:
  runtime:
    "@luxass/strip-json-comments": 2.0.2

  dev:
    oxfmt: 0.75.0
    oxlint: 1.90.0
    oxlint-tsgolint: 7.0.2005
    publint: 0.3.25
    tsdown: 0.23.4
    typescript: 7.0.2

  testing:
    "@vitest/coverage-v8": 5.1.0
    vitest: 5.1.0

  types:
    "@types/node": 24.19.0
